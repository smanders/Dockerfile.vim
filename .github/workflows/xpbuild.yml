name: Build
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:
jobs:
  macos:
    uses: externpro/externpro/.github/workflows/build-macos.yml@25.06.1
    with:
      artifact-pattern: "${{ github.event.repository.name }}-*.sh"
      cmake-workflow-preset: DarwinRelease
    secrets: inherit
