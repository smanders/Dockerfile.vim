name: Build
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:
jobs:
  linux:
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: externpro/externpro/.github/workflows/build-linux.yml@25.06.2
    with:
      artifact-pattern: "${{ github.event.repository.name }}-*.rpm"
      cmake-workflow-preset: LinuxRelease
      arch-list: '["amd64"]'
      buildpro-images: '["rocky9-gcc13"]'
    secrets: inherit
